[project]
name = "lalonja"
version = "1.0.1"
description = "Sistema de socios y cuotas del Club La Lonja"
readme = "README.md"
authors = [
    { name = "Oyola2024", email = "f.oyola@itecriocuarto.org.ar" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
